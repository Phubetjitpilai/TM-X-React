<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1280" height="720" fill="#fff"/>
<text x="64" y="62" text-anchor="start" font-size="30" font-weight="700" fill="#002060">Tolerance &amp; Template Selection</text>
<text x="64" y="94" text-anchor="start" font-size="16" font-weight="400" fill="#5B6570">The measurement mode decides where the pass / fail criteria come from</text>
<rect x="430" y="140" width="340" height="46" fill="#FCE4D6"/>
<text x="600.0" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#002060">IPM</text>
<rect x="800" y="140" width="340" height="46" fill="#FCE4D6"/>
<text x="970.0" y="170" text-anchor="middle" font-size="19" font-weight="700" fill="#002060">New  /  Rework</text>
<rect x="64" y="200" width="1076" height="92" fill="#FBFCFD" stroke="#C9D3DC"/>
<text x="88" y="238" text-anchor="start" font-size="19" font-weight="700" fill="#002060">Tolerance</text>
<text x="88" y="262" text-anchor="start" font-size="13.5" font-weight="400" fill="#8A94A0">where OK / NG limits come from</text>
<text x="600.0" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#002060" font-family="Consolas, Menlo, monospace">package_size</text>
<text x="970.0" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#002060" font-family="Consolas, Menlo, monospace">part_number</text>
<line x1="800" y1="200" x2="800" y2="292" stroke="#C9D3DC"/>
<line x1="430" y1="200" x2="430" y2="292" stroke="#C9D3DC"/>
<rect x="64" y="292" width="1076" height="92" fill="#FBFCFD" stroke="#C9D3DC"/>
<text x="88" y="330" text-anchor="start" font-size="19" font-weight="700" fill="#002060">Offset</text>
<text x="88" y="354" text-anchor="start" font-size="13.5" font-weight="400" fill="#8A94A0">is it part of the judgement</text>
<text x="600.0" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#8A94A0">not judged</text>
<text x="970.0" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#002060">judged</text>
<line x1="800" y1="292" x2="800" y2="384" stroke="#C9D3DC"/>
<line x1="430" y1="292" x2="430" y2="384" stroke="#C9D3DC"/>
<rect x="64" y="406" width="1076" height="96" fill="#EEF4F8" stroke="#1F6F8B" stroke-width="2"/>
<text x="88" y="446" text-anchor="start" font-size="19" font-weight="700" fill="#002060">Template</text>
<text x="88" y="470" text-anchor="start" font-size="13.5" font-weight="400" fill="#8A94A0">which measuring program the camera loads</text>
<line x1="430" y1="406" x2="430" y2="502" stroke="#1F6F8B" stroke-width="2"/>
<text x="785.0" y="456" text-anchor="middle" font-size="21" font-weight="700" fill="#002060" font-family="Consolas, Menlo, monospace">package_size</text>
<text x="785.0" y="480" text-anchor="middle" font-size="14" font-weight="400" fill="#1F6F8B">same source for both modes</text>
<rect x="64" y="546" width="1076" height="74" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="88" y="576" text-anchor="start" font-size="17" font-weight="700" fill="#C1440E">Only the criteria change with the mode — the program never does.</text>
<text x="88" y="600" text-anchor="start" font-size="15" font-weight="400" fill="#5B6570">IPM checks a kit part against its package size. New and Rework check a specific part number, which also carries an offset limit.</text>
</svg>