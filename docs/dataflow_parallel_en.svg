<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 445" width="1260" height="445" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1260" height="445" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker><marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A94A0"/></marker></defs>
<rect x="20" y="164" width="230" height="52" fill="#111111"/>
<text x="135.0" y="196.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">One piece measured</text>
<path d="M 250 216 H 285" stroke="#1F6F8B" stroke-width="2.6" fill="none"/>
<rect x="285" y="110" width="7" height="182" fill="#111111"/>
<rect x="380" y="90" width="200" height="52" fill="#111111"/>
<text x="480.0" y="122.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Raspberry Pi</text>
<rect x="660" y="90" width="170" height="52" fill="#111111"/>
<text x="745.0" y="122.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">MCU</text>
<rect x="380" y="260" width="200" height="52" fill="#111111"/>
<text x="480.0" y="292.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Data Receiver</text>
<rect x="660" y="260" width="200" height="52" fill="#111111"/>
<text x="760.0" y="292.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Core Service</text>
<rect x="940" y="260" width="200" height="52" fill="#111111"/>
<text x="1040.0" y="292.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Database</text>
<path d="M 292 116 H 372" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 580 116 H 652" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 292 286 H 372" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 580 286 H 652" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 860 286 H 932" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<circle cx="332" cy="86" r="16" fill="#1F6F8B"/>
<text x="332" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7a</text>
<text x="470" y="64" text-anchor="middle" font-size="14" font-weight="400" fill="#5B6570">send result — sort the part now</text>
<circle cx="332" cy="320" r="16" fill="#1F6F8B"/>
<text x="332" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7b</text>
<text x="470" y="348" text-anchor="middle" font-size="14" font-weight="400" fill="#5B6570">push values + image</text>
<circle cx="616" cy="320" r="14" fill="#1F6F8B"/>
<text x="616" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">8</text>
<circle cx="896" cy="320" r="14" fill="#1F6F8B"/>
<text x="896" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">9</text>
<text x="616" y="348" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">forward</text>
<text x="896" y="348" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">save</text>
<path d="M 700 260 V 200 H 460 V 150" fill="none" stroke="#8A94A0" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ad)"/>
<text x="580" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7A828C">waits for confirmation</text>
<text x="20" y="388" text-anchor="start" font-size="16" font-weight="700" fill="#333333">7a and 7b run in parallel — the sorter never waits for the database.</text>
<text x="20" y="414" text-anchor="start" font-size="15" font-weight="400" fill="#5B6570">But the Pi will not trigger the next piece until the value is confirmed saved.</text>
