<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1400" height="700" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker><marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A94A0"/></marker></defs>
<path d="M 290 294 H 512" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 600 280 V 124" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 750 294 H 972" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 1095 334 V 492" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 520 320 H 298" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 972 514 H 762" fill="none" stroke="#8A94A0" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ad)"/>
<path d="M 640 500 V 344" fill="none" stroke="#8A94A0" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ad)"/>
<rect x="60" y="280" width="230" height="54" fill="#111111"/>
<text x="175.0" y="314.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Web Application</text>
<rect x="520" y="280" width="230" height="54" fill="#111111"/>
<text x="635.0" y="314.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Core Services</text>
<rect x="520" y="60" width="230" height="54" fill="#111111"/>
<text x="635.0" y="94.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Database</text>
<rect x="980" y="280" width="230" height="54" fill="#111111"/>
<text x="1095.0" y="314.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Raspberry Pi</text>
<rect x="520" y="500" width="230" height="54" fill="#111111"/>
<text x="635.0" y="534.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Data Receiver</text>
<rect x="980" y="500" width="230" height="54" fill="#111111"/>
<text x="1095.0" y="534.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">TM-X Controller</text>
<circle cx="352" cy="212" r="15" fill="#1F6F8B"/>
<text x="352" y="217.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">1</text>
<text x="400" y="240" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Press Stop</text>
<text x="400" y="262" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">on the dashboard</text>
<circle cx="536" cy="136" r="15" fill="#1F6F8B"/>
<text x="536" y="141.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">2</text>
<text x="560" y="168" text-anchor="end" font-size="14.5" font-weight="700" fill="#333333">Mark the session as stopped</text>
<text x="560" y="190" text-anchor="end" font-size="14.5" font-weight="400" fill="#5B6570">state = Stopped, ended_at = now</text>
<circle cx="812" cy="212" r="15" fill="#1F6F8B"/>
<text x="812" y="217.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">3</text>
<text x="860" y="240" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Send stop command</text>
<text x="860" y="262" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">to the Raspberry Pi</text>
<circle cx="1140" cy="380" r="15" fill="#1F6F8B"/>
<text x="1140" y="385.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">4</text>
<text x="1162" y="375" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">Stop the loop and</text>
<text x="1162" y="397" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">close the TM-X connection</text>
<circle cx="352" cy="368" r="15" fill="#1F6F8B"/>
<text x="352" y="373.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">5</text>
<text x="400" y="400" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Screen shows STOPPED</text>
<text x="400" y="422" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">with the reason it ended</text>
<circle cx="866" cy="556" r="15" fill="#1F6F8B"/>
<text x="866" y="561.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">6</text>
<text x="866" y="584" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">Late values may still arrive</text>
<line x1="628" y1="408" x2="652" y2="432" stroke="#C0392B" stroke-width="3.4"/>
<line x1="652" y1="408" x2="628" y2="432" stroke="#C0392B" stroke-width="3.4"/>
<circle cx="690" cy="432" r="15" fill="#1F6F8B"/>
<text x="690" y="437.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#fff">7</text>
<text x="714" y="414" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">No running session</text>
<text x="714" y="436" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">→ value and image discarded</text>
<rect x="60" y="626" width="1280" height="52" rx="4" fill="#FDF3F2" stroke="#E8C4C0"/>
<text x="80" y="647" font-size="14.5" font-weight="700" fill="#C0392B">If the Pi cannot be reached</text>
<text x="80" y="668" font-size="14.5" fill="#5B6570">the database is already stopped but the machine may still be measuring — the system records STOP_NOT_DELIVERED and warns the operator.</text>
</svg>