<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1600" height="800" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2E4C"/></marker></defs>
<text x="40" y="52" text-anchor="start" font-size="28" font-weight="700" fill="#0F2E4C" opacity="1.0">Error Handling</text>
<text x="40" y="82" text-anchor="start" font-size="14" font-weight="400" fill="#7A8794" opacity="1.0">Three ways the system can fail, and who does what in each case</text>
<rect x="40" y="150" width="1520" height="115" fill="#F5F8FA"/>
<rect x="40" y="150" width="165" height="115" fill="#0F2E4C"/>
<text x="122.5" y="212.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">Raspberry Pi</text>
<line x1="40" y1="150" x2="1560" y2="150" stroke="#C8D3DC"/>
<rect x="40" y="265" width="1520" height="115" fill="#fff"/>
<rect x="40" y="265" width="165" height="115" fill="#0F2E4C"/>
<text x="122.5" y="327.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">Core Service</text>
<line x1="40" y1="265" x2="1560" y2="265" stroke="#C8D3DC"/>
<rect x="40" y="380" width="1520" height="115" fill="#F5F8FA"/>
<rect x="40" y="380" width="165" height="115" fill="#0F2E4C"/>
<text x="122.5" y="442.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">Database</text>
<line x1="40" y1="380" x2="1560" y2="380" stroke="#C8D3DC"/>
<rect x="40" y="495" width="1520" height="115" fill="#fff"/>
<rect x="40" y="495" width="165" height="115" fill="#0F2E4C"/>
<text x="122.5" y="557.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">Web App</text>
<line x1="40" y1="495" x2="1560" y2="495" stroke="#C8D3DC"/>
<line x1="40" y1="610" x2="1560" y2="610" stroke="#C8D3DC"/>
<rect x="205" y="112" width="545" height="32" rx="3" fill="#0F2E4C"/>
<text x="477.5" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">A measurement fails</text>
<rect x="760" y="112" width="400" height="32" rx="3" fill="#0F2E4C"/>
<text x="960.0" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">The Pi disconnects</text>
<rect x="1170" y="112" width="390" height="32" rx="3" fill="#0F2E4C"/>
<text x="1365.0" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff" opacity="1.0">The database is unreachable</text>
<line x1="750" y1="112" x2="750" y2="610" stroke="#0F2E4C" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="1160" y1="112" x2="1160" y2="610" stroke="#0F2E4C" stroke-width="1.4" stroke-dasharray="4,4"/>
<rect x="217.0" y="172" width="112.25" height="70" rx="3" fill="#C1651B"/>
<text x="273.125" y="197.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Trigger refused,</text>
<text x="273.125" y="211.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">or no value comes</text>
<text x="273.125" y="225.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">back</text>
<rect x="353.25" y="287" width="112.25" height="70" rx="3" fill="#2E7BA6"/>
<text x="409.375" y="319.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Records what</text>
<text x="409.375" y="333.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">failed and why</text>
<rect x="353.25" y="402" width="112.25" height="70" rx="3" fill="#2E7BA6"/>
<text x="409.375" y="427.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Saved as the</text>
<text x="409.375" y="441.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">session&#x27;s last</text>
<text x="409.375" y="455.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">event</text>
<rect x="489.5" y="517" width="112.25" height="70" rx="3" fill="#C1651B"/>
<text x="545.625" y="542.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Modal shows the</text>
<text x="545.625" y="556.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">reason — Retry,</text>
<text x="545.625" y="570.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Accept or Stop</text>
<rect x="625.75" y="172" width="112.25" height="70" rx="3" fill="#2E7BA6"/>
<text x="681.875" y="204.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Carries out the</text>
<text x="681.875" y="218.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">operator&#x27;s answer</text>
<path d="M329.25,207.0 L341.25,207.0 L341.25,322.0 L353.25,322.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M409.375,357 L409.375,402" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M465.5,322.0 L477.5,322.0 L477.5,552.0 L489.5,552.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M601.75,552.0 L613.75,552.0 L613.75,207.0 L625.75,207.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="772.0" y="172" width="109.33333333333334" height="70" rx="3" fill="#C1651B"/>
<text x="826.6666666666666" y="211.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Heartbeat stops</text>
<rect x="905.3333333333334" y="287" width="109.33333333333334" height="70" rx="3" fill="#2E7BA6"/>
<text x="960.0" y="319.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Nothing heard for</text>
<text x="960.0" y="333.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">5 seconds</text>
<rect x="905.3333333333334" y="402" width="109.33333333333334" height="70" rx="3" fill="#2E7BA6"/>
<text x="960.0" y="434.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Session marked</text>
<text x="960.0" y="448.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">INTERRUPTED</text>
<rect x="1038.6666666666667" y="517" width="109.33333333333334" height="70" rx="3" fill="#C1651B"/>
<text x="1093.3333333333335" y="542.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Pi turns red ·</text>
<text x="1093.3333333333335" y="556.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">session closes</text>
<text x="1093.3333333333335" y="570.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">itself</text>
<path d="M881.3333333333334,207.0 L893.3333333333334,207.0 L893.3333333333334,322.0 L905.3333333333334,322.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M960.0,357 L960.0,402" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M1014.6666666666667,322.0 L1026.6666666666667,322.0 L1026.6666666666667,552.0 L1038.6666666666667,552.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1182.0" y="517" width="106.0" height="70" rx="3" fill="#2E7BA6"/>
<text x="1235.0" y="549.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Asks for the</text>
<text x="1235.0" y="563.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">session state</text>
<rect x="1312.0" y="287" width="106.0" height="70" rx="3" fill="#C1651B"/>
<text x="1365.0" y="319.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">MySQL does not</text>
<text x="1365.0" y="333.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">answer in time</text>
<rect x="1312.0" y="402" width="106.0" height="70" rx="3" fill="#fff" stroke="#C1651B" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="1365.0" y="441.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#C1651B" opacity="1.0">unreachable</text>
<rect x="1442.0" y="517" width="106.0" height="70" rx="3" fill="#C1651B"/>
<text x="1495.0" y="549.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">DB Offline ·</text>
<text x="1495.0" y="563.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" opacity="1.0">Start is locked</text>
<path d="M1288.0,552.0 L1300.0,552.0 L1300.0,322.0 L1312.0,322.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M1365.0,357 L1365.0,402" fill="none" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<path d="M1418.0,322.0 L1430.0,322.0 L1430.0,552.0 L1442.0,552.0" fill="none" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M205,644 L1540,644" fill="none" stroke="#7A8794" stroke-width="1.4" marker-end="url(#ar)" opacity=".55"/>
<text x="235" y="636" text-anchor="start" font-size="11.5" font-weight="700" fill="#7A8794" opacity="1.0">time</text>
<rect x="40" y="688" width="17" height="17" rx="2" fill="#2E7BA6"/>
<text x="66" y="702" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C" opacity="1.0">Handled automatically</text>
<rect x="290" y="688" width="17" height="17" rx="2" fill="#C1651B"/>
<text x="316" y="702" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C" opacity="1.0">The failure, and what the operator sees</text>
<rect x="40" y="724" width="1520" height="52" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="60" y="747" text-anchor="start" font-size="14.5" font-weight="700" fill="#C1651B" opacity="1.0">Only the first case asks the operator anything — the part is still on the machine, so only a person can decide what to do with it.</text>
<text x="60" y="768" text-anchor="start" font-size="12.5" font-weight="400" fill="#7A8794" opacity="1.0">When the Pi or the database drops out there is nothing left to choose, so the system closes the session on its own.</text>
</svg>