<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 730" width="1420" height="730" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1420" height="730" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker></defs>
<rect x="70" y="130" width="230" height="54" fill="#111111"/>
<text x="185.0" y="163.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#fff">Raspberry Pi</text>
<rect x="540" y="130" width="230" height="54" fill="#111111"/>
<text x="655.0" y="163.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#fff">Core Service</text>
<rect x="1010" y="130" width="230" height="54" fill="#111111"/>
<text x="1125.0" y="163.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#fff">Database</text>
<rect x="540" y="300" width="230" height="54" fill="#111111"/>
<text x="655.0" y="333.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#fff">Web Application</text>
<path d="M 300 157 H 532" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 770 157 H 1002" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 655 184 V 292" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<circle cx="394" cy="116" r="14" fill="#1F6F8B"/>
<text x="394" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="394" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">POST /api/heartbeat</text>
<text x="394" y="88" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">every 5 s, with session_id</text>
<circle cx="864" cy="116" r="14" fill="#1F6F8B"/>
<text x="864" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="886" y="66" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">UPDATE sessions.last_seen</text>
<text x="886" y="88" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">only while the session is running</text>
<circle cx="655" cy="238" r="14" fill="#1F6F8B"/>
<text x="655" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="690" y="214" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">SSE — the PI chip turns green</text>
<text x="690" y="236" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">_pi_last_seen kept in memory, expires after 5 s</text>
<rect x="70" y="430" width="620" height="186" rx="6" fill="#F7FAFC" stroke="#C9D8E2"/>
<rect x="70" y="430" width="620" height="40" rx="6" fill="#E4EEF4"/>
<rect x="70" y="458" width="620" height="12" fill="#E4EEF4"/>
<text x="88" y="456" text-anchor="start" font-size="15.5" font-weight="700" fill="#12536B">If the Pi cannot reach the Core Service</text>
<circle cx="100" cy="495" r="13" fill="#1F6F8B"/>
<text x="100" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">4</text>
<text x="122" y="500" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">heartbeat fails for more than 15 s</text>
<text x="122" y="526" text-anchor="start" font-size="14.5" font-weight="400" fill="#8A94A0">→</text>
<text x="146" y="526" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">the Pi sets is_running = False and stops on its own</text>
<text x="122" y="550" text-anchor="start" font-size="13.5" font-weight="400" fill="#7A828C">“carrying on would only produce values that get</text>
<text x="122" y="574" text-anchor="start" font-size="13.5" font-weight="400" fill="#7A828C">discarded, because the session is already dead”</text>
<rect x="730" y="430" width="620" height="186" rx="6" fill="#F7FAFC" stroke="#C9D8E2"/>
<rect x="730" y="430" width="620" height="40" rx="6" fill="#E4EEF4"/>
<rect x="730" y="458" width="620" height="12" fill="#E4EEF4"/>
<text x="748" y="456" text-anchor="start" font-size="15.5" font-weight="700" fill="#12536B">If the Core Service stops hearing the Pi</text>
<circle cx="760" cy="495" r="13" fill="#1F6F8B"/>
<text x="760" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">5</text>
<text x="782" y="500" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">heartbeat_checker looks every 5 s for a running</text>
<text x="782" y="526" text-anchor="start" font-size="13.5" font-weight="400" fill="#7A828C">session whose last_seen is older than 15 s</text>
<circle cx="760" cy="545" r="13" fill="#1F6F8B"/>
<text x="760" y="550" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">6</text>
<text x="782" y="550" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">marks it timeout, clears the queue, pushes SSE</text>
<text x="782" y="576" text-anchor="start" font-size="13.5" font-weight="400" fill="#7A828C">the browser shows INTERRUPTED with the reason</text>
<text x="70" y="662" text-anchor="start" font-size="16.5" font-weight="700" fill="#333333">Both sides watch each other — whichever notices first, the session stops.</text>
<text x="70" y="686" text-anchor="start" font-size="15" font-weight="400" fill="#5B6570">Neither side can leave the other measuring into a void.</text>
</svg>