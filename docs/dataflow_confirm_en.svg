<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 450" width="1220" height="450" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1220" height="450" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker><marker id="ad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7A8A99"/></marker></defs>
<rect x="60" y="190" width="220" height="54" fill="#111111"/>
<text x="170.0" y="223.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Data Receiver</text>
<rect x="430" y="190" width="220" height="54" fill="#111111"/>
<text x="540.0" y="223.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Core Service</text>
<rect x="430" y="66" width="220" height="50" fill="#111111"/>
<text x="540.0" y="97.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Database</text>
<rect x="850" y="190" width="220" height="54" fill="#111111"/>
<text x="960.0" y="223.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Raspberry Pi</text>
<path d="M 280 217 H 422" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 540 190 V 128" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 850 204 H 658" fill="none" stroke="#7A8A99" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ad)"/>
<path d="M 650 236 H 842" fill="none" stroke="#7A8A99" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ad)"/>
<circle cx="352" cy="180" r="13" fill="#1F6F8B"/>
<text x="352" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">8</text>
<circle cx="500" cy="152" r="13" fill="#1F6F8B"/>
<text x="500" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">9</text>
<text x="352" y="152" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">forward</text>
<text x="540" y="52" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">store the value</text>
<circle cx="752" cy="204" r="15" fill="#1F6F8B"/>
<text x="752" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">10</text>
<text x="750" y="178" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">the Pi asks:  has measured_count increased?</text>
<text x="750" y="266" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">yes  →  trigger the next piece</text>
<text x="750" y="288" text-anchor="middle" font-size="13.5" font-weight="400" fill="#5B6570">count_after  &gt;  count_before</text>
<rect x="60" y="330" width="1100" height="66" rx="4" fill="#FDF3F2" stroke="#E8C4C0"/>
<text x="80" y="357" text-anchor="start" font-size="14.5" font-weight="700" fill="#C1440E">If it has not increased after 15 seconds</text>
<text x="80" y="379" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">the value never reached the database — the modal asks the operator to accept the value the Pi is holding, or to stop.</text>
</svg>