<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 968" width="1560" height="968" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1560" height="968" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F2E4C"/></marker></defs>
<text x="40" y="50" text-anchor="start" font-size="26" font-weight="700" fill="#0F2E4C" opacity="1.0">Start and Running</text>
<text x="40" y="78" text-anchor="start" font-size="13" font-weight="400" fill="#7A8794" opacity="1.0">Every message below matches the code — the TCP commands, endpoints and SSE event names are the real ones</text>
<rect x="55.0" y="100" width="150" height="40" rx="3" fill="#0F2E4C"/>
<text x="130" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">Web App</text>
<line x1="130" y1="140" x2="130" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="320.0" y="100" width="160" height="40" rx="3" fill="#0F2E4C"/>
<text x="400" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">Core Service</text>
<line x1="400" y1="140" x2="400" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="572.5" y="100" width="135" height="40" rx="3" fill="#0F2E4C"/>
<text x="640" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">Database</text>
<line x1="640" y1="140" x2="640" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="802.5" y="100" width="155" height="40" rx="3" fill="#0F2E4C"/>
<text x="880" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">Data Receiver</text>
<line x1="880" y1="140" x2="880" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="1055.0" y="100" width="150" height="40" rx="3" fill="#0F2E4C"/>
<text x="1130" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">Raspberry Pi</text>
<line x1="1130" y1="140" x2="1130" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="1322.5" y="100" width="175" height="40" rx="3" fill="#0F2E4C"/>
<text x="1410" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" opacity="1.0">TM-X Controller</text>
<line x1="1410" y1="140" x2="1410" y2="864" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="46" y="390" width="1468" height="466" rx="4" fill="none" stroke="#C1651B" stroke-width="1.8" stroke-dasharray="7,5"/>
<rect x="40" y="158" width="1480" height="26" fill="#EEF3F7"/>
<text x="54" y="176" text-anchor="start" font-size="11.5" font-weight="700" fill="#2E7BA6" opacity="1.0">START</text>
<line x1="133" y1="198" x2="396" y2="198" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="188.85000000000002" y="179" width="152.29999999999998" height="16" fill="#fff"/>
<text x="265.0" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">POST /api/session/start</text>
<text x="265.0" y="213" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">{ groups[], target_count }</text>
<line x1="403" y1="237" x2="636" y2="237" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="398.1" y="218" width="243.79999999999998" height="16" fill="#fff"/>
<text x="520.0" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">INSERT INTO sessions   state = running</text>
<line x1="403" y1="264" x2="1126" y2="264" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="585.15" y="245" width="359.7" height="16" fill="#fff"/>
<text x="765.0" y="257" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">POST /command   { action: &quot;start&quot;, session_id, groups[] }</text>
<line x1="397" y1="291" x2="134" y2="291" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="194.95" y="272" width="140.1" height="16" fill="#fff"/>
<text x="265.0" y="284" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">SSE   session_started</text>
<line x1="1133" y1="318" x2="1406" y2="318" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1257.9" y="299" width="24.2" height="16" fill="#fff"/>
<text x="1270.0" y="311" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">R0</text>
<text x="1270.0" y="333" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">reset the controller</text>
<line x1="1133" y1="357" x2="1406" y2="357" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1239.6" y="338" width="60.8" height="16" fill="#fff"/>
<text x="1270.0" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">PW,1,nnn</text>
<text x="1270.0" y="372" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">load the measuring program</text>
<rect x="46" y="396" width="1468" height="26" fill="#FBEDE3"/>
<text x="60" y="414" text-anchor="start" font-size="11.5" font-weight="700" fill="#C1651B" opacity="1.0">LOOP   —   repeated for every piece,  1 … target_count</text>
<line x1="1127" y1="436" x2="404" y2="436" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="691.9" y="417" width="146.2" height="16" fill="#fff"/>
<text x="765.0" y="429" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">GET /api/session/state</text>
<text x="765.0" y="451" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">remembers measured_count</text>
<rect x="965" y="476" width="330" height="30" rx="3" fill="#fff" stroke="#C1651B" stroke-width="1.6"/>
<text x="1130" y="496" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C1651B" opacity="1.0">waits for the trigger — the MCU, or the button on the web</text>
<line x1="1133" y1="532" x2="1406" y2="532" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1224.35" y="513" width="91.3" height="16" fill="#fff"/>
<text x="1270.0" y="525" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">MRS  then  T1</text>
<text x="1270.0" y="547" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">clear the old value, then measure once</text>
<line x1="1133" y1="571" x2="1406" y2="571" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1245.7" y="552" width="48.599999999999994" height="16" fill="#fff"/>
<text x="1270.0" y="564" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">GM,3,0</text>
<text x="1270.0" y="586" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">asked again every 20 ms until a new value appears</text>
<line x1="1407" y1="610" x2="1134" y2="610" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="1218.25" y="591" width="103.5" height="16" fill="#fff"/>
<text x="1270.0" y="603" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">X · Y · offsets</text>
<text x="1270.0" y="625" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">the Pi judges OK / NG and tells the MCU</text>
<line x1="1407" y1="649" x2="884" y2="649" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="1056.65" y="630" width="176.7" height="16" fill="#fff"/>
<text x="1145.0" y="642" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">FTP   result .txt  +  image</text>
<line x1="877" y1="676" x2="404" y2="676" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="566.9" y="657" width="146.2" height="16" fill="#fff"/>
<text x="640.0" y="669" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">POST /api/measurements</text>
<line x1="403" y1="703" x2="636" y2="703" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="379.8" y="684" width="280.4" height="16" fill="#fff"/>
<text x="520.0" y="696" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">INSERT measurements   ·   measured_count + 1</text>
<line x1="397" y1="730" x2="134" y2="730" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="207.15" y="711" width="115.69999999999999" height="16" fill="#fff"/>
<text x="265.0" y="723" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">SSE   measurement</text>
<line x1="877" y1="757" x2="404" y2="757" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="512.0" y="738" width="256.0" height="16" fill="#fff"/>
<text x="640.0" y="750" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">POST /api/measurements/{id}/image-upload</text>
<line x1="1127" y1="784" x2="404" y2="784" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="691.9" y="765" width="146.2" height="16" fill="#fff"/>
<text x="765.0" y="777" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">GET /api/session/state</text>
<text x="765.0" y="799" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794" opacity="1.0">polled until measured_count moves</text>
<line x1="403" y1="823" x2="1126" y2="823" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="652.25" y="804" width="225.5" height="16" fill="#fff"/>
<text x="765.0" y="816" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C" opacity="1.0">measured_count + 1   →   next piece</text>
<rect x="40" y="888" width="1480" height="56" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="60" y="912" text-anchor="start" font-size="14.5" font-weight="700" fill="#C1651B" opacity="1.0">The measured value and the image never pass through the Pi — the TM-X sends them straight to the PC.</text>
<text x="60" y="932" text-anchor="start" font-size="12.5" font-weight="400" fill="#7A8794" opacity="1.0">The Pi only waits for confirmation that the row reached the database before it moves on to the next piece.</text>
</svg>