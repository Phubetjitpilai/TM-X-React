<rect x="700" y="410" width="230" height="56" fill="#111111"/>
<text x="815.0" y="445.0" text-anchor="middle" font-size="19.5" font-weight="700" fill="#FFFFFF">Data Receiver</text>
<circle cx="320" cy="190" r="13" fill="#1F6F8B"/>
<text x="320" y="195.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">1</text>
<text x="320" y="133" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Press Start</text>
<text x="320" y="155" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">with the list of ALPL to measure</text>
<circle cx="320" cy="266" r="13" fill="#1F6F8B"/>
<text x="320" y="271.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">7</text>
<text x="160" y="442" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Result appears instantly</text>
<text x="160" y="464" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">no page refresh needed</text>
<circle cx="390" cy="340" r="13" fill="#1F6F8B"/>
<text x="390" y="345.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">2</text>
<text x="368" y="326" text-anchor="end" font-size="15.5" font-weight="700" fill="#333333">Create a new Session</text>
<text x="368" y="348" text-anchor="end" font-size="15.5" font-weight="400" fill="#5B6570">state = Running</text>
<circle cx="650" cy="190" r="13" fill="#1F6F8B"/>
<text x="650" y="195.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">3</text>
<text x="650" y="133" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Send the measurement plan</text>
<text x="650" y="155" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">program + OK/NG criteria</text>
<circle cx="980" cy="190" r="13" fill="#1F6F8B"/>
<text x="980" y="195.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">4</text>
<text x="980" y="123" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Trigger one piece</text>
<text x="980" y="145" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">at a time</text>
<circle cx="1145" cy="340" r="13" fill="#1F6F8B"/>
<text x="1145" y="345.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">5</text>
<text x="1163" y="330" text-anchor="start" font-size="15.5" font-weight="700" fill="#333333">Send measured values</text>
<text x="1163" y="352" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6570">and the image</text>
<circle cx="630" cy="437" r="13" fill="#1F6F8B"/>
<text x="630" y="442.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">6</text>
<text x="645" y="490" text-anchor="middle" font-size="15.5" font-weight="700" fill="#333333">Forward to the core service</text>
<text x="645" y="512" text-anchor="middle" font-size="15.5" font-weight="400" fill="#5B6570">judge OK / NG, then save</text>
