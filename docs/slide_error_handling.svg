<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1280" height="720" fill="#fff"/>
<text x="64" y="60" text-anchor="start" font-size="30" font-weight="700" fill="#002060">Error Handling</text>
<text x="64" y="90" text-anchor="start" font-size="15.5" font-weight="400" fill="#5B6570">What can go wrong, why it happens, and what the system does about it</text>
<rect x="64" y="126" width="1152" height="40" fill="#EEF2F6"/>
<text x="78" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#1F6F8B">ERROR</text>
<text x="368" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#1F6F8B">CAUSE</text>
<text x="738" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#1F6F8B">HOW THE SYSTEM HANDLES IT</text>
<rect x="64" y="166" width="1152" height="34" fill="#FCE4D6"/>
<text x="78" y="189" text-anchor="start" font-size="13.5" font-weight="700" fill="#C1440E">During a measurement  —  the part is still there, so the operator decides</text>
<text x="80" y="230" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">Trigger refused</text>
<text x="370" y="230" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">The controller is not ready yet right</text>
<text x="370" y="250" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">after the measuring program is loaded</text>
<text x="740" y="230" text-anchor="start" font-size="14" font-weight="400" fill="#002060">Retries three times on its own · still failing → asks</text>
<text x="740" y="250" text-anchor="start" font-size="14" font-weight="400" fill="#002060">the operator: retry or stop</text>
<line x1="64" y1="200" x2="1216" y2="200" stroke="#D6DEE7"/>
<text x="80" y="304" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">No measurement returned</text>
<text x="370" y="304" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">The part sits out of place, or the</text>
<text x="370" y="324" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">camera cannot see it</text>
<text x="740" y="304" text-anchor="start" font-size="14" font-weight="400" fill="#002060">Polls for 8 seconds · no value → asks the operator:</text>
<text x="740" y="324" text-anchor="start" font-size="14" font-weight="400" fill="#002060">retry or stop</text>
<line x1="64" y1="274" x2="1216" y2="274" stroke="#D6DEE7"/>
<text x="80" y="378" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">Value never reached the</text>
<text x="80" y="399" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">database</text>
<text x="370" y="378" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">The receiving service is not running,</text>
<text x="370" y="398" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">or the transfer did not arrive</text>
<text x="740" y="378" text-anchor="start" font-size="14" font-weight="400" fill="#002060">Asks the operator to accept the value the Pi still</text>
<text x="740" y="398" text-anchor="start" font-size="14" font-weight="400" fill="#002060">holds (without the image), or stop</text>
<line x1="64" y1="348" x2="1216" y2="348" stroke="#D6DEE7"/>
<rect x="64" y="422" width="1152" height="34" fill="#E8EEF3"/>
<text x="78" y="445" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F6F8B">Connection lost  —  nothing left to decide, so the system acts alone</text>
<text x="80" y="486" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">Lost contact with the</text>
<text x="80" y="507" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">machine</text>
<text x="370" y="486" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">The Pi lost power, or the network</text>
<text x="370" y="506" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">dropped</text>
<text x="740" y="486" text-anchor="start" font-size="14" font-weight="400" fill="#002060">Closes the session automatically · the dashboard</text>
<text x="740" y="506" text-anchor="start" font-size="14" font-weight="400" fill="#002060">shows INTERRUPTED</text>
<line x1="64" y1="456" x2="1216" y2="456" stroke="#D6DEE7"/>
<text x="80" y="560" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">Cannot reach the</text>
<text x="80" y="581" text-anchor="start" font-size="15.5" font-weight="700" fill="#002060">database</text>
<text x="370" y="560" text-anchor="start" font-size="14" font-weight="400" fill="#5B6570">MySQL is not running</text>
<text x="740" y="560" text-anchor="start" font-size="14" font-weight="400" fill="#002060">Shows DB Offline and locks the Start button</text>
<line x1="64" y1="530" x2="1216" y2="530" stroke="#D6DEE7"/>
<line x1="64" y1="604" x2="1216" y2="604" stroke="#D6DEE7"/>
<line x1="354" y1="126" x2="354" y2="604" stroke="#D6DEE7"/>
<line x1="724" y1="126" x2="724" y2="604" stroke="#D6DEE7"/>
<rect x="64" y="166" width="1152" height="34" fill="#FCE4D6"/>
<text x="80" y="189" text-anchor="start" font-size="13.5" font-weight="700" fill="#C1440E">During a measurement  —  the part is still there, so the operator decides</text>
<rect x="64" y="422" width="1152" height="34" fill="#E8EEF3"/>
<text x="80" y="445" text-anchor="start" font-size="13.5" font-weight="700" fill="#1F6F8B">Connection lost  —  nothing left to decide, so the system acts alone</text>
<rect x="64" y="626" width="1152" height="56" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="84" y="650" text-anchor="start" font-size="16" font-weight="700" fill="#C1440E">Every failure reaches the operator with its reason — nothing fails silently.</text>
<text x="84" y="672" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">The system decides everything it can decide on its own, and only asks when the answer depends on the part in front of you.</text>
</svg>