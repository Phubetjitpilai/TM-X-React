<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1400" height="760" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker></defs>
<rect x="560" y="40" width="280" height="56" fill="#111111"/>
<text x="700.0" y="74.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">Any API request</text>
<rect x="530" y="150" width="340" height="56" fill="#14568C"/>
<text x="700.0" y="184.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">Is the DB breaker open?</text>
<rect x="560" y="280" width="280" height="56" fill="#111111"/>
<text x="700.0" y="314.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">Connect to MySQL</text>
<rect x="560" y="410" width="280" height="56" fill="#111111"/>
<text x="700.0" y="444.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">Connection returned</text>
<rect x="1010" y="150" width="320" height="56" fill="#C1440E"/>
<text x="1170.0" y="184.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">503 immediately  ·  0 ms</text>
<rect x="1010" y="280" width="320" height="56" fill="#C1440E"/>
<text x="1170.0" y="314.5" text-anchor="middle" font-size="17.5" font-weight="700" fill="#fff">503  ·  breaker opens 2 s</text>
<path d="M 700 96 V 142" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 700 206 V 272" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="716" y="246" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">no</text>
<path d="M 700 336 V 402" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="716" y="376" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">connected</text>
<path d="M 872 178 H 1002" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="940" y="168" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">yes</text>
<path d="M 840 308 H 1002" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="920" y="298" text-anchor="middle" font-size="14.5" font-weight="700" fill="#333333">fails</text>
<text x="512" y="172" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">a connection failed less than 2 s ago</text>
<text x="512" y="192" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">do not even try, fail instantly</text>
<text x="540" y="304" text-anchor="end" font-size="13.5" font-weight="700" fill="#333333">connect_timeout = 3 s</text>
<text x="540" y="324" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">new connection every request, no pool</text>
<text x="540" y="434" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">the breaker resets to closed</text>
<rect x="60" y="500" width="1280" height="98" rx="5" fill="#F7FAFC" stroke="#C9D8E2"/>
<text x="82" y="528" text-anchor="start" font-size="16" font-weight="700" fill="#14568C">Why the breaker exists</text>
<text x="82" y="552" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">get_db() opens a fresh connection per request by design. Without the breaker a dead MySQL costs every request the full 3 s —</text>
<text x="82" y="574" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">and the dashboard polls every 2 s, so requests pile up until the whole page looks frozen. With it, only the first request pays;</text>
<text x="82" y="596" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">the rest fail in 0 ms, and everything recovers the moment MySQL answers again.</text>
<rect x="60" y="622" width="1280" height="64" rx="5" fill="#FBFCFD" stroke="#DDE5EC"/>
<text x="82" y="650" text-anchor="start" font-size="15.5" font-weight="700" fill="#333333">heartbeat_checker is the one caller that must not die</text>
<text x="82" y="674" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">when the database is unreachable it skips that round and tries again in 5 s, instead of raising and killing the background task.</text>
</svg>