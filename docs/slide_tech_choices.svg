<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1280" height="720" fill="#fff"/>
<text x="64" y="60" text-anchor="start" font-size="30" font-weight="700" fill="#002060">Technology Choices</text>
<text x="64" y="90" text-anchor="start" font-size="16" font-weight="400" fill="#5B6570">Chosen for one operator and about 3,000 parts a year</text>
<rect x="64" y="132" width="1152" height="40" fill="#EEF2F6"/>
<text x="80" y="158" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F6F8B">LAYER</text>
<text x="280" y="158" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F6F8B">TOOL</text>
<text x="590" y="158" text-anchor="start" font-size="11.5" font-weight="700" fill="#1F6F8B">WHY</text>
<text x="80" y="208.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Web Application</text>
<text x="280" y="208.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">React · Vite · TanStack Query</text>
<text x="590" y="199.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Replaced 2,500 lines of hand-written JavaScript; data fetching</text>
<text x="590" y="217.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">and caching stop being our problem</text>
<line x1="64" y1="172" x2="1216" y2="172" stroke="#D6DEE7"/>
<rect x="64" y="234" width="1152" height="62" fill="#FBFCFD"/>
<text x="80" y="270.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Core Service</text>
<text x="280" y="270.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">FastAPI · Python 3.11</text>
<text x="590" y="261.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Same language as the scripts that drive the camera, so one</text>
<text x="590" y="279.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">person can maintain both ends</text>
<line x1="64" y1="234" x2="1216" y2="234" stroke="#D6DEE7"/>
<text x="80" y="332.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Database</text>
<text x="280" y="332.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">MySQL 8</text>
<text x="590" y="323.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Installed directly as a Windows service — no container to keep</text>
<text x="590" y="341.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">alive on the shop floor</text>
<line x1="64" y1="296" x2="1216" y2="296" stroke="#D6DEE7"/>
<rect x="64" y="358" width="1152" height="62" fill="#FBFCFD"/>
<text x="80" y="394.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Live updates</text>
<text x="280" y="394.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">Server-Sent Events</text>
<text x="590" y="385.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Data only travels server to browser, so a one-way channel is</text>
<text x="590" y="403.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">enough</text>
<line x1="64" y1="358" x2="1216" y2="358" stroke="#D6DEE7"/>
<text x="80" y="456.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Edge Controller</text>
<text x="280" y="456.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">Python on Raspberry Pi</text>
<text x="590" y="456.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Sits on the local wire and speaks TCP to the TM-X controller</text>
<line x1="64" y1="420" x2="1216" y2="420" stroke="#D6DEE7"/>
<rect x="64" y="482" width="1152" height="62" fill="#FBFCFD"/>
<text x="80" y="518.0" text-anchor="start" font-size="15" font-weight="700" fill="#002060">Dashboard</text>
<text x="280" y="518.0" text-anchor="start" font-size="15" font-weight="400" fill="#1F6F8B">Power BI</text>
<text x="590" y="518.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Chosen by the end user — already the reporting standard here</text>
<line x1="64" y1="482" x2="1216" y2="482" stroke="#D6DEE7"/>
<line x1="64" y1="544" x2="1216" y2="544" stroke="#D6DEE7"/>
<line x1="264" y1="132" x2="264" y2="544" stroke="#D6DEE7"/>
<line x1="574" y1="132" x2="574" y2="544" stroke="#D6DEE7"/>
<rect x="64" y="570" width="1152" height="60" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="84" y="596" text-anchor="start" font-size="16" font-weight="700" fill="#C1440E">Nothing here was chosen for scale.</text>
<text x="84" y="618" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">Everything was chosen so one PC in the room stays maintainable by the people who work there.</text>
</svg>