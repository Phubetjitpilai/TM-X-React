<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1600" height="880" fill="#fff"/>
<text x="56" y="58" text-anchor="start" font-size="30" font-weight="700" fill="#0F2E4C">Two ways to show a screen</text>
<text x="56" y="88" text-anchor="start" font-size="14.5" font-weight="400" fill="#7A8794">Same screenshot, same words — only the order changes</text>
<rect x="56" y="120" width="720" height="620" rx="6" fill="#fff" stroke="#C8D3DC" stroke-width="1.4"/>
<rect x="56" y="120" width="720" height="40" rx="6" fill="#94A3B0"/>
<rect x="56" y="146" width="720" height="14" fill="#94A3B0"/>
<text x="416.0" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">THE USUAL WAY  —  caption underneath</text>
<text x="84" y="206" text-anchor="start" font-size="22" font-weight="700" fill="#0F2E4C">Dashboard</text>
<rect x="84" y="228" width="664" height="300" rx="4" fill="#E9EDF1" stroke="#C8D3DC" stroke-dasharray="6,5"/>
<text x="416.0" y="383.0" text-anchor="middle" font-size="14" font-weight="400" fill="#9AA7B2">screenshot</text>
<text x="84" y="564" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C">The dashboard shows live telemetry through SSE, a queue strip for the ALPL</text>
<text x="84" y="586" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C">list, statistics for the current session, and a table of measurements with a</text>
<text x="84" y="608" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C">report modal.</text>
<rect x="84" y="628" width="664" height="86" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="100" y="656" text-anchor="start" font-size="13.5" font-weight="700" fill="#C1651B">The eye goes to the picture and stops there.</text>
<text x="100" y="678" text-anchor="start" font-size="12" font-weight="400" fill="#7A8794">Nobody knows what to look at, so they scan it at random</text>
<text x="100" y="697" text-anchor="start" font-size="12" font-weight="400" fill="#7A8794">and the sentence underneath never gets read.</text>
<rect x="824" y="120" width="720" height="620" rx="6" fill="#fff" stroke="#0F2E4C" stroke-width="1.8"/>
<rect x="824" y="120" width="720" height="40" rx="6" fill="#2E7BA6"/>
<rect x="824" y="146" width="720" height="14" fill="#2E7BA6"/>
<text x="1184.0" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BETTER  —  claim first, then proof</text>
<text x="852" y="206" text-anchor="start" font-size="22" font-weight="700" fill="#0F2E4C">One screen replaces the KEYENCE panel</text>
<text x="852" y="230" text-anchor="start" font-size="14" font-weight="400" fill="#7A8794">every reading appears the moment the part is measured</text>
<rect x="852" y="250" width="664" height="278" rx="4" fill="#E9EDF1" stroke="#C8D3DC" stroke-dasharray="6,5"/>
<text x="1184.0" y="394.0" text-anchor="middle" font-size="14" font-weight="400" fill="#9AA7B2">screenshot</text>
<circle cx="876.0" cy="562" r="13" fill="#C1651B"/>
<text x="876.0" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="898.0" y="558" text-anchor="start" font-size="12.5" font-weight="700" fill="#0F2E4C">Live value and OK / NG</text>
<circle cx="1081.3333333333333" cy="562" r="13" fill="#C1651B"/>
<text x="1081.3333333333333" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="1103.3333333333333" y="558" text-anchor="start" font-size="12.5" font-weight="700" fill="#0F2E4C">Queue — where the run</text>
<text x="1103.3333333333333" y="575" text-anchor="start" font-size="12.5" font-weight="700" fill="#0F2E4C">is</text>
<circle cx="1286.6666666666667" cy="562" r="13" fill="#C1651B"/>
<text x="1286.6666666666667" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="1308.6666666666667" y="558" text-anchor="start" font-size="12.5" font-weight="700" fill="#0F2E4C">Every reading, kept</text>
<rect x="852" y="600" width="664" height="52" rx="4" fill="#F5F8FA" stroke="#C8D3DC"/>
<text x="868" y="632" text-anchor="start" font-size="14" font-weight="700" fill="#0F2E4C">Operators no longer read numbers off the camera and write them down.</text>
<rect x="852" y="664" width="664" height="50" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="868" y="694" text-anchor="start" font-size="12.5" font-weight="700" fill="#C1651B">They are told what to look for before they look — so the picture proves a point instead of being one.</text>
<rect x="56" y="768" width="1488" height="66" rx="5" fill="#0F2E4C"/>
<text x="800.0" y="800" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Headline = the claim  ·  Screenshot = the proof  ·  Numbered marks = where to look  ·  One line = what it changed</text>
<text x="800.0" y="822" text-anchor="middle" font-size="12.5" font-weight="400" fill="#CBD8E2">Three or four screens told this way beat eight screens with captions underneath</text>
</svg>