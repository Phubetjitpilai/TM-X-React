<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1280" height="720" fill="#fff"/>
<text x="64" y="60" text-anchor="start" font-size="30" font-weight="700" fill="#002060">Challenges &amp; Solutions</text>
<text x="64" y="90" text-anchor="start" font-size="16" font-weight="400" fill="#5B6570">Assumptions that reality corrected — none of them visible on paper</text>
<rect x="64" y="132" width="340" height="424" rx="4" fill="#FBFCFD" stroke="#D6DEE7"/>
<circle cx="98" cy="170" r="17" fill="#002060"/>
<text x="98" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
<text x="128" y="176" text-anchor="start" font-size="17" font-weight="700" fill="#002060">The Pi was not</text>
<text x="128" y="199" text-anchor="start" font-size="17" font-weight="700" fill="#002060">allowed online</text>
<text x="88" y="244" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">WHAT HAPPENED</text>
<text x="88" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Company policy keeps the Raspberry Pi off</text>
<text x="88" y="285" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">the Internet, so the original plan of</text>
<text x="88" y="304" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">having it receive the images and pass them</text>
<text x="88" y="323" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">on could not stand.</text>
<text x="88" y="356" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">HOW WE FIXED IT</text>
<text x="88" y="378" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">The Pi now only sends commands. The camera</text>
<text x="88" y="397" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">writes its results and images straight to</text>
<text x="88" y="416" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">the PC.</text>
<rect x="64" y="472" width="340" height="84" fill="#FCE4D6"/>
<text x="88" y="496" text-anchor="start" font-size="10.5" font-weight="700" fill="#C1440E">LESSON</text>
<text x="88" y="518" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">Network policy is part of the design,</text>
<text x="88" y="537" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">not a detail to settle later.</text>
<rect x="470" y="132" width="340" height="424" rx="4" fill="#FBFCFD" stroke="#D6DEE7"/>
<circle cx="504" cy="170" r="17" fill="#002060"/>
<text x="504" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
<text x="534" y="176" text-anchor="start" font-size="17" font-weight="700" fill="#002060">The status badge that</text>
<text x="534" y="199" text-anchor="start" font-size="17" font-weight="700" fill="#002060">never turned green</text>
<text x="494" y="244" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">WHAT HAPPENED</text>
<text x="494" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">Opening the page fires a dozen requests at</text>
<text x="494" y="285" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">once, and a browser limits how many</text>
<text x="494" y="304" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">connections one site may hold — the live</text>
<text x="494" y="323" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">status stream had to queue behind them.</text>
<text x="494" y="356" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">HOW WE FIXED IT</text>
<text x="494" y="378" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">One shared live connection for the whole</text>
<text x="494" y="397" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">app instead of one per component.</text>
<rect x="470" y="472" width="340" height="84" fill="#FCE4D6"/>
<text x="494" y="496" text-anchor="start" font-size="10.5" font-weight="700" fill="#C1440E">LESSON</text>
<text x="494" y="518" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">The resource that ran out belonged to</text>
<text x="494" y="537" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">the browser, not the server.</text>
<rect x="876" y="132" width="340" height="424" rx="4" fill="#FBFCFD" stroke="#D6DEE7"/>
<circle cx="910" cy="170" r="17" fill="#002060"/>
<text x="910" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
<text x="940" y="176" text-anchor="start" font-size="17" font-weight="700" fill="#002060">The images that would</text>
<text x="940" y="199" text-anchor="start" font-size="17" font-weight="700" fill="#002060">not stop</text>
<text x="900" y="244" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">WHAT HAPPENED</text>
<text x="900" y="266" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">The camera shipped in internal trigger</text>
<text x="900" y="285" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">mode — it measured on its own schedule and</text>
<text x="900" y="304" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">flooded the receiver with images nobody</text>
<text x="900" y="323" text-anchor="start" font-size="13.5" font-weight="400" fill="#5B6570">asked for.</text>
<text x="900" y="356" text-anchor="start" font-size="10.5" font-weight="700" fill="#1F6F8B">HOW WE FIXED IT</text>
<text x="900" y="378" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">Set the controller to external trigger</text>
<text x="900" y="397" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">during installation, so nothing is</text>
<text x="900" y="416" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">measured until the software sends one</text>
<text x="900" y="435" text-anchor="start" font-size="13.5" font-weight="400" fill="#002060">command per part.</text>
<rect x="876" y="472" width="340" height="84" fill="#FCE4D6"/>
<text x="900" y="496" text-anchor="start" font-size="10.5" font-weight="700" fill="#C1440E">LESSON</text>
<text x="900" y="518" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">Decide who owns the timing — if the</text>
<text x="900" y="537" text-anchor="start" font-size="14" font-weight="700" fill="#C1440E">device decides, you are only reacting.</text>
</svg>