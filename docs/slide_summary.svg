<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" width="1600" height="790" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1600" height="790" fill="#fff"/>
<text x="56" y="66" text-anchor="start" font-size="34" font-weight="700" fill="#0F2E4C">Summary</text>
<text x="56" y="98" text-anchor="start" font-size="15" font-weight="400" fill="#7A8794">What was built, what it changes on the floor, and what is still open</text>
<rect x="56" y="150" width="480" height="450" rx="5" fill="#F5F8FA" stroke="#0F2E4C" stroke-width="1.4"/>
<path d="M61,150 h470 a5,5 0 0 1 5,5 v33 h-480 v-33 a5,5 0 0 1 5,-5 z" fill="#2E7BA6"/>
<text x="296.0" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">WHAT WAS BUILT</text>
<circle cx="82" cy="223" r="3.5" fill="#2E7BA6"/>
<text x="100" y="228" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">A dashboard that starts and stops a</text>
<text x="100" y="249" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">measurement run</text>
<circle cx="82" cy="287" r="3.5" fill="#2E7BA6"/>
<text x="100" y="292" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">A service that holds all state and decides</text>
<text x="100" y="313" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">OK / NG</text>
<circle cx="82" cy="351" r="3.5" fill="#2E7BA6"/>
<text x="100" y="356" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">An edge controller that drives the TM-X and</text>
<text x="100" y="377" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">the MCU</text>
<circle cx="82" cy="415" r="3.5" fill="#2E7BA6"/>
<text x="100" y="420" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">A database of every reading, with its image</text>
<circle cx="82" cy="458" r="3.5" fill="#2E7BA6"/>
<text x="100" y="463" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Export to CSV, Excel and PDF, plus a Power</text>
<text x="100" y="484" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">BI dashboard</text>
<rect x="560" y="150" width="480" height="450" rx="5" fill="#F5F8FA" stroke="#0F2E4C" stroke-width="1.4"/>
<path d="M565,150 h470 a5,5 0 0 1 5,5 v33 h-480 v-33 a5,5 0 0 1 5,-5 z" fill="#2E7BA6"/>
<text x="800.0" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">WHAT IT CHANGES</text>
<circle cx="586" cy="223" r="3.5" fill="#2E7BA6"/>
<text x="604" y="228" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Measuring no longer means working the</text>
<text x="604" y="249" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">KEYENCE screen by hand</text>
<circle cx="586" cy="287" r="3.5" fill="#2E7BA6"/>
<text x="604" y="292" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Every reading is stored with its image</text>
<text x="604" y="313" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">instead of written down</text>
<circle cx="586" cy="351" r="3.5" fill="#2E7BA6"/>
<text x="604" y="356" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Results reach viewers without an operator</text>
<text x="604" y="377" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">sending them</text>
<circle cx="586" cy="415" r="3.5" fill="#2E7BA6"/>
<text x="604" y="420" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Failures are reported with their reason —</text>
<text x="604" y="441" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">nothing fails quietly</text>
<circle cx="586" cy="479" r="3.5" fill="#2E7BA6"/>
<text x="604" y="484" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">One place decides pass or fail, so no two</text>
<text x="604" y="505" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">parts of the system disagree</text>
<rect x="1064" y="150" width="480" height="450" rx="5" fill="#F5F8FA" stroke="#0F2E4C" stroke-width="1.4"/>
<path d="M1069,150 h470 a5,5 0 0 1 5,5 v33 h-480 v-33 a5,5 0 0 1 5,-5 z" fill="#C1651B"/>
<text x="1304.0" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">WHAT IS NEXT</text>
<circle cx="1090" cy="223" r="3.5" fill="#C1651B"/>
<text x="1108" y="228" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Replace the trigger button with the real MCU</text>
<text x="1108" y="249" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">signal over Serial</text>
<circle cx="1090" cy="287" r="3.5" fill="#C1651B"/>
<text x="1108" y="292" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Serve the React front end in place of the</text>
<text x="1108" y="313" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">original pages</text>
<circle cx="1090" cy="351" r="3.5" fill="#C1651B"/>
<text x="1108" y="356" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Keep the measurement queue through a server</text>
<text x="1108" y="377" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">restart</text>
<circle cx="1090" cy="415" r="3.5" fill="#C1651B"/>
<text x="1108" y="420" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Check what the TM-X answers to R0 and PW</text>
<text x="1108" y="441" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">before measuring</text>
<circle cx="1090" cy="479" r="3.5" fill="#C1651B"/>
<text x="1108" y="484" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">Add sign-in before the system is opened up</text>
<text x="1108" y="505" text-anchor="start" font-size="14" font-weight="400" fill="#0F2E4C">more widely</text>
<rect x="56" y="638" width="1488" height="92" rx="5" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="80" y="676" text-anchor="start" font-size="17" font-weight="700" fill="#C1651B">The whole software path works end to end today — a part goes in, and the result and its image reach the database and the dashboard on their own.</text>
<text x="80" y="704" text-anchor="start" font-size="14" font-weight="400" fill="#7A8794">What is left is the last hardware signal from the MCU, and the hardening that only daily use will ask for.</text>
</svg>