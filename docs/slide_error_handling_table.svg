<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 712" width="1600" height="712" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1600" height="712" fill="#fff"/>
<text x="40" y="58" text-anchor="start" font-size="30" font-weight="700" fill="#0F2E4C">Error Handling</text>
<text x="40" y="88" text-anchor="start" font-size="14" font-weight="400" fill="#7A8794">What can go wrong, why it happens, and what the system does about it</text>
<rect x="40" y="112" width="1520" height="38" fill="#0F2E4C"/>
<text x="105.0" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">POSITION</text>
<text x="275.0" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">ERROR TYPE</text>
<text x="500.0" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">ERROR</text>
<text x="820.0" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">CAUSE</text>
<text x="1290.0" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">HOW THE SYSTEM HANDLES IT</text>
<rect x="40" y="150" width="1520" height="176" fill="#FBEDE3"/>
<line x1="170" y1="150" x2="170" y2="326" stroke="#C8D3DC"/>
<line x1="380" y1="150" x2="380" y2="326" stroke="#C8D3DC"/>
<line x1="620" y1="150" x2="620" y2="326" stroke="#C8D3DC"/>
<line x1="1020" y1="150" x2="1020" y2="326" stroke="#C8D3DC"/>
<text x="275.0" y="243.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C1651B">During measurement</text>
<text x="105.0" y="184.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">Pi</text>
<text x="500.0" y="184.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Trigger fail</text>
<text x="634" y="184.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">READY is not on</text>
<text x="1034" y="184.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Retries three times on its own, then asks the operator: retry or stop</text>
<line x1="40" y1="208" x2="1560" y2="208" stroke="#C8D3DC"/>
<text x="105.0" y="242.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">Pi</text>
<text x="500.0" y="242.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Get measurement fail</text>
<text x="634" y="242.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The part is out of place, or the camera cannot see it</text>
<text x="1034" y="242.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Polls for 8 seconds, then asks the operator: retry or stop</text>
<line x1="40" y1="266" x2="1560" y2="266" stroke="#C8D3DC"/>
<text x="105.0" y="301.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">Pi</text>
<text x="500.0" y="301.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Data receive fail</text>
<text x="634" y="291.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The receiving service is not running, or the transfer did</text>
<text x="634" y="311.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">not arrive</text>
<text x="1034" y="301.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Asks the operator to accept the value the Pi still holds, or stop</text>
<line x1="40" y1="326" x2="1560" y2="326" stroke="#0F2E4C" stroke-width="1.3"/>
<rect x="40" y="326" width="1520" height="176" fill="#EDF2F6"/>
<line x1="170" y1="326" x2="170" y2="502" stroke="#C8D3DC"/>
<line x1="380" y1="326" x2="380" y2="502" stroke="#C8D3DC"/>
<line x1="620" y1="326" x2="620" y2="502" stroke="#C8D3DC"/>
<line x1="1020" y1="326" x2="1020" y2="502" stroke="#C8D3DC"/>
<text x="275.0" y="419.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2E7BA6">Connection lost</text>
<text x="105.0" y="361.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">Pi</text>
<text x="500.0" y="361.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">TM-X lost connection</text>
<text x="634" y="351.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The LAN cable is unplugged, the TM-X is off, or the IP is</text>
<text x="634" y="371.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">wrong</text>
<text x="1034" y="361.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Ends the session and shows what to check</text>
<line x1="40" y1="386" x2="1560" y2="386" stroke="#C8D3DC"/>
<text x="105.0" y="420.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">PC Server</text>
<text x="500.0" y="420.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Pi lost connection</text>
<text x="634" y="420.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The Pi lost power, or the network dropped</text>
<text x="1034" y="420.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Closes the session and shows INTERRUPTED</text>
<line x1="40" y1="444" x2="1560" y2="444" stroke="#C8D3DC"/>
<text x="105.0" y="478.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">PC Server</text>
<text x="500.0" y="478.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Database lost connection</text>
<text x="634" y="478.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The MySQL service is not running</text>
<text x="1034" y="478.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Shows DB Offline and locks Start · reconnects automatically</text>
<line x1="40" y1="502" x2="1560" y2="502" stroke="#0F2E4C" stroke-width="1.3"/>
<rect x="40" y="502" width="1520" height="60" fill="#FBEDE3"/>
<line x1="170" y1="502" x2="170" y2="562" stroke="#C8D3DC"/>
<line x1="380" y1="502" x2="380" y2="562" stroke="#C8D3DC"/>
<line x1="620" y1="502" x2="620" y2="562" stroke="#C8D3DC"/>
<line x1="1020" y1="502" x2="1020" y2="562" stroke="#C8D3DC"/>
<text x="275.0" y="537.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C1651B">Command fail</text>
<text x="105.0" y="537.0" text-anchor="middle" font-size="13" font-weight="400" fill="#0F2E4C">PC Server</text>
<text x="500.0" y="537.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F2E4C">Can&#x27;t send command to Pi</text>
<text x="634" y="527.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">The Pi program is not running, or it is busy with a</text>
<text x="634" y="547.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">previous command</text>
<text x="1034" y="527.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Shows the reason so the operator can try again · after 3 failures, asks for the</text>
<text x="1034" y="547.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#0F2E4C">Pi to be restarted</text>
<line x1="40" y1="562" x2="1560" y2="562" stroke="#0F2E4C" stroke-width="1.3"/>
<rect x="40" y="588" width="17" height="17" rx="2" fill="#FBEDE3" stroke="#C8D3DC"/>
<text x="66" y="602" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C">The system waits for the operator</text>
<rect x="420" y="588" width="17" height="17" rx="2" fill="#EDF2F6" stroke="#C8D3DC"/>
<text x="446" y="602" text-anchor="start" font-size="13" font-weight="400" fill="#0F2E4C">The system acts on its own and reports it</text>
<rect x="40" y="624" width="1520" height="52" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="60" y="648" text-anchor="start" font-size="15.5" font-weight="700" fill="#C1651B">Every failure reaches the operator with its reason — nothing fails silently.</text>
<text x="60" y="668" text-anchor="start" font-size="12.5" font-weight="400" fill="#7A8794">It does everything it can by itself, and stops to ask only when it cannot go on without a person.</text>
</svg>