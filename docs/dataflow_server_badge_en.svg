<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800" font-family="Segoe UI, Tahoma, Arial, sans-serif"><rect width="1440" height="800" fill="#fff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1F6F8B"/></marker></defs>
<rect x="500" y="46" width="440" height="56" fill="#14568C"/>
<text x="720.0" y="80.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Two signals, checked together</text>
<text x="720.0" y="126" text-anchor="middle" font-size="14" font-weight="400" fill="#5B6570">SSE stream (browser ↔ Core Service)   ·   GET /api/session/state every 4 s</text>
<rect x="500" y="160" width="440" height="56" fill="#14568C"/>
<text x="720.0" y="194.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Is the SSE stream down?</text>
<rect x="500" y="300" width="440" height="56" fill="#14568C"/>
<text x="720.0" y="334.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Did the poll return 200?</text>
<rect x="500" y="440" width="440" height="56" fill="#14568C"/>
<text x="720.0" y="474.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Poll failed, SSE still alive?</text>
<rect x="500" y="580" width="440" height="56" fill="#6E6E6E"/>
<text x="720.0" y="614.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">🟡  Server Connecting</text>
<rect x="1060" y="160" width="300" height="56" fill="#C1440E"/>
<text x="1210.0" y="194.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">🔴  Server Offline</text>
<rect x="1060" y="300" width="300" height="56" fill="#1E7A4C"/>
<text x="1210.0" y="334.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">🟢  Server Online</text>
<rect x="1060" y="440" width="300" height="56" fill="#B4801A"/>
<text x="1210.0" y="474.5" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">🟡  DB Offline</text>
<path d="M 720.0 102 V 152" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<path d="M 720.0 216 V 292" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="736.0" y="262" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">no</text>
<path d="M 720.0 356 V 432" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="736.0" y="402" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">no</text>
<path d="M 720.0 496 V 572" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="736.0" y="542" text-anchor="start" font-size="14.5" font-weight="700" fill="#333333">no</text>
<path d="M 942 188 H 1052" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="997" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">yes</text>
<path d="M 942 328 H 1052" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="997" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">yes</text>
<path d="M 942 468 H 1052" fill="none" stroke="#1F6F8B" stroke-width="2.6" marker-end="url(#ah)"/>
<text x="997" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">yes</text>
<text x="480" y="182" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">backend not answering at all</text>
<text x="480" y="202" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">this outranks everything else</text>
<text x="480" y="322" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">MySQL answered — fully usable</text>
<text x="480" y="342" text-anchor="end" font-size="13.5" font-weight="700" fill="#333333">green only from a real success</text>
<text x="480" y="462" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">page opens, data will not load</text>
<text x="480" y="602" text-anchor="end" font-size="13.5" font-weight="400" fill="#5B6570">no result yet, first few seconds</text>
<rect x="60" y="668" width="1320" height="56" rx="5" fill="#F7FAFC" stroke="#C9D8E2"/>
<text x="82" y="692" text-anchor="start" font-size="15.5" font-weight="700" fill="#14568C">A dropped SSE always outranks a failed poll</text>
<text x="82" y="714" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">when the backend is truly dead the poll fails too — reporting “just the DB” would send the operator looking in the wrong place.</text>
<rect x="60" y="734" width="1320" height="52" rx="5" fill="#FDF3F2" stroke="#E8C4C0"/>
<text x="82" y="758" text-anchor="start" font-size="15.5" font-weight="700" fill="#C1440E">Green is never inferred from “no error”</text>
<text x="82" y="780" text-anchor="start" font-size="14.5" font-weight="400" fill="#5B6570">a network-level failure carries no HTTP status, so “not 503” would have flipped the badge back to green while nothing worked.</text>
</svg>