<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 812" width="1560" height="812" font-family="Helvetica, Segoe UI, Arial, sans-serif"><rect width="1560" height="812" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F2E4C"/></marker></defs>
<text x="40" y="50" text-anchor="start" font-size="26" font-weight="700" fill="#0F2E4C">Heartbeat</text>
<text x="40" y="78" text-anchor="start" font-size="13" font-weight="400" fill="#7A8794">How each side knows the other is still alive — one message, used in both directions</text>
<rect x="110.0" y="100" width="160" height="40" rx="3" fill="#0F2E4C"/>
<text x="190" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Web App</text>
<line x1="190" y1="140" x2="190" y2="708" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="495.0" y="100" width="170" height="40" rx="3" fill="#0F2E4C"/>
<text x="580" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Core Service</text>
<line x1="580" y1="140" x2="580" y2="708" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="877.5" y="100" width="145" height="40" rx="3" fill="#0F2E4C"/>
<text x="950" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Database</text>
<line x1="950" y1="140" x2="950" y2="708" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="1260.0" y="100" width="160" height="40" rx="3" fill="#0F2E4C"/>
<text x="1340" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Raspberry Pi</text>
<line x1="1340" y1="140" x2="1340" y2="708" stroke="#0F2E4C" stroke-width="1.2" stroke-dasharray="4,5" opacity=".45"/>
<rect x="40" y="158" width="1480" height="26" fill="#EEF3F7"/>
<text x="54" y="176" text-anchor="start" font-size="11.5" font-weight="700" fill="#2E7BA6">EVERY 2 SECONDS  —  whether the machine is measuring or not</text>
<line x1="1337" y1="198" x2="584" y2="198" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="780.15" y="179" width="359.7" height="16" fill="#fff"/>
<text x="960.0" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">POST /api/heartbeat   { session_id, waiting_for_trigger }</text>
<rect x="364.55" y="226" width="430.9" height="30" rx="3" fill="#fff" stroke="#C1651B" stroke-width="1.6"/>
<text x="580" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C1651B">kept in memory first — this still works even when MySQL is down</text>
<line x1="583" y1="282" x2="946" y2="282" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="652.25" y="263" width="225.5" height="16" fill="#fff"/>
<text x="765.0" y="275" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">UPDATE sessions   last_seen = NOW()</text>
<text x="765.0" y="297" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794">only while a session is running</text>
<line x1="193" y1="321" x2="576" y2="321" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="311.9" y="302" width="146.2" height="16" fill="#fff"/>
<text x="385.0" y="314" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">GET /api/session/state</text>
<text x="385.0" y="336" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794">every 1 s while measuring, every 4 s when idle</text>
<line x1="577" y1="360" x2="194" y2="360" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="296.65" y="341" width="176.7" height="16" fill="#fff"/>
<text x="385.0" y="353" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">pi_status  ·  trigger_ready</text>
<text x="385.0" y="375" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794">the green badge, and whether the Trigger button may be pressed</text>
<rect x="40" y="399" width="1480" height="26" fill="#FBEDE3"/>
<text x="54" y="417" text-anchor="start" font-size="11.5" font-weight="700" fill="#C1651B">IF THE PI GOES SILENT</text>
<rect x="345.65" y="440" width="468.7" height="30" rx="3" fill="#fff" stroke="#C1651B" stroke-width="1.6"/>
<text x="580" y="460" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C1651B">a background check looks for a running session last seen over 5 s ago</text>
<line x1="583" y1="496" x2="946" y2="496" stroke="#0F2E4C" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="594.3" y="477" width="341.4" height="16" fill="#fff"/>
<text x="765.0" y="489" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">UPDATE sessions   state = &#x27;timeout&#x27;,  ended_at = NOW()</text>
<line x1="577" y1="523" x2="194" y2="523" stroke="#0F2E4C" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<rect x="314.95" y="504" width="140.1" height="16" fill="#fff"/>
<text x="385.0" y="516" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F2E4C">SSE   session_timeout</text>
<text x="385.0" y="538" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A8794">the dashboard shows INTERRUPTED</text>
<rect x="40" y="562" width="1480" height="26" fill="#FBEDE3"/>
<text x="54" y="580" text-anchor="start" font-size="11.5" font-weight="700" fill="#C1651B">IF THE BACKEND GOES SILENT  —  the same beat, read the other way round</text>
<line x1="1337" y1="602" x2="868.8" y2="602" stroke="#C1651B" stroke-width="1.7"/>
<path d="M859.8,593 L877.8,611 M877.8,593 L859.8,611" stroke="#C1651B" stroke-width="2.6" stroke-linecap="round"/>
<rect x="1040.45" y="583" width="127.89999999999999" height="16" fill="#fff"/>
<text x="1104.4" y="595" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C1651B">POST /api/heartbeat</text>
<text x="1104.4" y="617" text-anchor="middle" font-size="10.5" font-weight="400" fill="#C1651B">never arrives</text>
<rect x="971.6999999999999" y="642" width="544.3" height="30" rx="3" fill="#fff" stroke="#C1651B" stroke-width="1.6"/>
<text x="1243.85" y="662" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C1651B">after 5 s without a single beat getting through, the Pi stops measuring by itself</text>
<rect x="40" y="732" width="1480" height="56" rx="4" fill="#FDF6F2" stroke="#E8C4C0"/>
<text x="60" y="756" text-anchor="start" font-size="14.5" font-weight="700" fill="#C1651B">One message covers both directions — the server notices a dead Pi, and the Pi notices a dead server from the very same beat.</text>
<text x="60" y="776" text-anchor="start" font-size="12.5" font-weight="400" fill="#7A8794">So a broken link is never silent on one side only: within about 5 seconds both ends have stopped, and no value is recorded that nobody is watching.</text>
</svg>