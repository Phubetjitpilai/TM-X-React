<circle cx="645" cy="740" r="9"/><line x1="645" y1="749" x2="645" y2="770"/><line x1="633" y1="758" x2="657" y2="758"/><line x1="645" y1="770" x2="635" y2="785"/><line x1="645" y1="770" x2="655" y2="785"/>
