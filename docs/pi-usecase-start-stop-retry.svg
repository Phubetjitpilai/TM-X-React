<text x="215" y="940">is_running = false</text><text x="215" y="1020">ปิด socket TM-X</text>
</g>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3">
<ellipse cx="425" cy="935" rx="90" ry="30"/><ellipse cx="425" cy="1015" rx="90" ry="30"/>
</g>
