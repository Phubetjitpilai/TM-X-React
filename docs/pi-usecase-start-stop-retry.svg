<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1487" viewBox="0 0 680 1487" role="img" font-family="Noto Sans Thai, Sarabun, Leelawadee UI, Segoe UI, Garuda, Tahoma, sans-serif">
<title>Use case diagram ของ Pi.py — start / stop / retry / รับค่าจาก Pi</title>
<desc>แผนภาพสี่กล่องตามปุ่มที่ผู้ใช้กด กล่องแรกไล่ขั้นตอนการวัดทีละชิ้น กล่อง retry แยกเป็นสองฝั่งคือพังที่ T1 กับพังที่ GM แล้วมาบรรจบกันที่การนับรอบ</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#5F5E5A" stroke-width="1.4"/></marker>
<marker id="ph" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#7F77DD" stroke-width="1.3"/></marker>
<marker id="rh" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#993C1D" stroke-width="1.3"/></marker>
</defs>
<rect x="0" y="0" width="680" height="1487" fill="#FFFFFF"/>
