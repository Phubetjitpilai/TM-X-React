<ellipse cx="320" cy="145" rx="105" ry="25"/><ellipse cx="320" cy="227" rx="105" ry="25"/><ellipse cx="320" cy="309" rx="105" ry="25"/><ellipse cx="320" cy="397" rx="105" ry="36"/><ellipse cx="320" cy="485" rx="105" ry="25"/><ellipse cx="320" cy="567" rx="105" ry="25"/><ellipse cx="320" cy="649" rx="105" ry="25"/><ellipse cx="320" cy="731" rx="105" ry="25"/>
