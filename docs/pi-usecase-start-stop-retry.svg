<g text-anchor="middle" font-size="14" fill="#3C3489">
<text x="320" y="142">ต่อ TCP · R0 · PW,1,nnn</text>
<text x="320" y="232">รอสัญญาณจาก MCU</text>
<text x="320" y="306">ส่ง MRS</text>
<text x="320" y="381">ยิง T1</text>
<text x="320" y="482">วน GM ทุก 20 ms</text>
<text x="320" y="564">ตัดสิน ok / ng</text>
<text x="320" y="646">ส่ง result ให้ MCU</text>
<text x="320" y="728">ตรวจว่าค่าเข้า DB ไหม</text>
</g>
<g text-anchor="middle" font-size="12" fill="#534AB7">
<text x="320" y="159">ครั้งเดียวตอนเริ่ม</text>
<text x="320" y="323">ล้างค่าเก่าใน TM-X</text>
<text x="320" y="398">สั่งวัด 1 ชิ้น</text>
<text x="320" y="415">error แล้ว retry เอง 3 ครั้ง</text>
<text x="320" y="499">วนสูงสุด 8 วิ</text>
<text x="320" y="581">เทียบกับ limits ที่ได้มา</text>
<text x="320" y="663">ok · ng</text>
<text x="320" y="745">ภายใน 15 วิ</text>
</g>
<text x="320" y="792" font-size="12" fill="#5F5E5A" text-anchor="middle">เข้า DB แล้ว → วนข้อ 2–8 ต่อจนครบจำนวนชิ้น</text>
<g fill="#FAECE7" stroke="#993C1D" stroke-width="1.3">
<ellipse cx="215" cy="935" rx="90" ry="28"/><ellipse cx="215" cy="1015" rx="90" ry="28"/>
</g>
