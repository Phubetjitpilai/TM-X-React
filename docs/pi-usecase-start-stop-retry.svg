<rect x="115" y="857" width="200" height="220" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="127" y="879" font-size="12" fill="#5F5E5A">2) กด stop</text>
<rect x="325" y="857" width="200" height="220" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="337" y="879" font-size="12" fill="#5F5E5A">4) กดรับค่าจาก Pi</text>
