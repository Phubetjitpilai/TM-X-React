<text x="153" y="1467" font-size="12" fill="#5F5E5A">สำเร็จ ไปขั้นถัดไป</text>
<line x1="280" y1="1463" x2="316" y2="1463" stroke="#993C1D" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#rh)"/>
<text x="323" y="1467" font-size="12" fill="#5F5E5A">พัง ต้องให้ผู้ใช้ตัดสิน</text>
