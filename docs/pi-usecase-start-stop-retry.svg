<text x="215" y="1169">T1 พัง →</text><text x="215" y="1186">ส่ง MRS และยิง T1 ใหม่</text>
<text x="320" y="1287">rounds += 1</text><text x="320" y="1369">ถามได้แค่ 2 ครั้ง</text>
</g>
<g text-anchor="middle" font-size="12" fill="#5F5E5A">
<text x="215" y="1204">สำเร็จ → กลับไปวน GM</text>
<text x="320" y="1304">T1 กับ GM นับแยกกัน</text><text x="320" y="1386">รอบที่ 3 ยังพังอยู่ ไป 2)</text>
</g>
<g text-anchor="middle" font-size="14" fill="#633806">
<text x="425" y="1169">GM พัง (ไม่ได้รับค่า) →</text><text x="425" y="1186">วน GM ใหม่</text>
