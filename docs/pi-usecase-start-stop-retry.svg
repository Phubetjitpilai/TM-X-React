<text x="186" y="394">T1 พัง</text><text x="186" y="409">ไป 2) / 3)</text>
<text x="186" y="482">GM พัง</text><text x="186" y="497">ไป 2) / 3)</text>
<text x="186" y="728">ไม่เข้า DB</text><text x="186" y="743">ไป 2) / 4)</text>
</g>
